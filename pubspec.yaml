dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.2.4

flutter_native_splash:
  background_image: assets/images/8.png
  image: assets/logo/logo-5.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/social_media/
    - assets/icons/emotions/
    - assets/logo/
    - assets/fonts/
    - assets/json/user/
    - assets/json/
    - assets/route/

  fonts:
    - family: Sfblack
      fonts:
        - asset: assets/fonts/sf-ui-black.otf

    - family: Sfbold
      fonts:
        - asset: assets/fonts/sf-ui-bold.otf

    - family: Sfheavy
      fonts:
        - asset: assets/fonts/sf-ui-heavy.otf

    - family: Sflight
      fonts:
        - asset: assets/fonts/sf-ui-light.otf

    - family: Sfmedium
      fonts:
        - asset: assets/fonts/sf-ui-medium.otf

    - family: Sfsemibold
      fonts:
        - asset: assets/fonts/sf-ui-semibold.otf

    - family: Sfthin
      fonts:
        - asset: assets/fonts/sf-ui-thin.otf

    - family: Sfultralight
      fonts:
        - asset: assets/fonts/sf-ui-ultralight.otf
